name: Build and publish PanVK-rynx

# Builds the Mali-G77 PanVK driver for aarch64 glibc on an arm64 runner and publishes the
# archive DroidDeck fetches by tag + sha256. Push builds only upload an artifact; a release
# is created only from workflow_dispatch with an explicit tag.
on:
  push:
    paths:
      - 'build.sh'
      - 'patches/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream fork version to build (tag v<version>)'
        required: false
        default: '1.2.0'
      tag:
        description: 'Release tag, e.g. PanVK-rynx-1.2.0-p8; empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git ninja-build pkg-config patch \
            libwayland-dev libwayland-egl-backend-dev \
            libdrm-dev libx11-dev libxext-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-keysyms1-dev \
            libxfixes-dev libxrandr-dev libxshmfence-dev libxxf86vm-dev \
            libglvnd-dev libegl-dev libgles-dev \
            python3-mako python3-ply python3-yaml python3-packaging \
            libelf-dev zlib1g-dev libzstd-dev libexpat1-dev \
            bison flex zstd libdisplay-info-dev libudev-dev wayland-protocols >/dev/null
          # mesa_clc compiles libpoly's shaders at build time; the driver itself must not
          # link LLVM/SPIRV, which build.sh asserts after stripping.
          sudo apt-get install -y -qq --no-install-recommends \
            llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev spirv-tools >/dev/null
      - name: Install meson
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages -U 'meson>=1.4'
          meson --version
          meson --version | awk -F. '{ exit !($1 > 1 || ($1 == 1 && $2 >= 4)) }'
      - name: Name the build after its tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${TAG:-}" =~ -p([0-9]+)$ ]]; then
            echo "PANVK_RYNX_PATCH=p${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "code name: PanVK-rynx-${{ inputs.version || '1.2.0' }}-p${BASH_REMATCH[1]}"
          else
            echo "no -p<n> suffix in '${TAG:-}'; building without a patch level"
          fi
      - name: Build PanVK-rynx
        env:
          PANVK_RYNX_VERSION: ${{ inputs.version || '1.2.0' }}
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-rynx
          path: |
            PanVK-rynx-*.tzst
            PanVK-rynx-*.tzst.sha256
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" --latest=false --prerelease=false \
            --title "${{ inputs.tag }}" \
            --notes "PanVK-rynx-${PANVK_RYNX_VERSION:-1.2.0}${PANVK_RYNX_PATCH:+-$PANVK_RYNX_PATCH} - the Mali-G77 Vulkan driver (glibc): Valhall v9 JM and v10/v11 CSF on the source tree's own kbase backend. sha256 $(cut -d' ' -f1 PanVK-rynx-*.tzst.sha256)" \
            PanVK-rynx-*.tzst PanVK-rynx-*.tzst.sha256 \
            || gh release upload "${{ inputs.tag }}" PanVK-rynx-*.tzst PanVK-rynx-*.tzst.sha256 --clobber
          # A component fetched by tag, never a user install: keep it out of Latest.
          gh release edit "${{ inputs.tag }}" --latest=false --prerelease=false
